name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller
          npm ci --omit=dev
          New-Item -ItemType Directory -Force runtime
          Copy-Item (Get-Command node).Source runtime\node.exe
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Bundle Freetify
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onedir --name Freetify
          --windowed
          --collect-all demoparser2 --collect-all webview
          --add-data "index.html;."
          --add-data "app.js;."
          --add-data "styles.css;."
          --add-data "manifest.webmanifest;."
          --add-data "sw.js;."
          --add-data "assets;assets"
          --add-data "steam_gc_sidecar.js;."
          --add-data "node_modules;node_modules"
          --add-binary "runtime\node.exe;."
          server.py
      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Freetify-Windows-Installer
          path: Output/FreetifySetup.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/FreetifySetup.exe
          generate_release_notes: true
